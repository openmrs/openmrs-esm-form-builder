# Keeps src/form.schema.json, the copy of the reference form schema the schema editor validates against,
# in sync with https://json.openmrs.org/form.schema.json (openmrs-contrib-json-schemas)

name: 'Check for Form Schema Updates'

on:
  workflow_dispatch:
  schedule:
    # Runs every 4 hours
    - cron: '30 */4 * * *'

jobs:
  check-for-updates:
    name: Check for updates to the reference form schema
    runs-on: ubuntu-latest

    if: github.repository_owner == 'openmrs'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: 📄 Download the reference form schema
        run: curl -fsSL https://json.openmrs.org/form.schema.json -o src/form.schema.json

      # Fails on anything that isn't a form schema, such as an error page served with a 200 status
      - name: ✅ Check the download is a form schema
        run: jq -e '.properties.pages' src/form.schema.json > /dev/null

      - name: ⬆️ Create PR if necessary
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: '(chore) Update the reference form schema'
          title: '(chore) Update the reference form schema'
          body: |
            Updates `src/form.schema.json` to match https://json.openmrs.org/form.schema.json, which the schema editor validates against.

            > This PR was automatically generated by the Form Schema Update workflow and will be automatically merged if checks pass.
          branch: 'chore/update-form-schema'
          author: 'OpenMRS Bot <infrastructure@openmrs.org>'
          committer: 'OpenMRS Bot <infrastructure@openmrs.org>'
          token: ${{ secrets.OMRS_BOT_GH_TOKEN }}
          labels: |
            automated-pr
          delete-branch: true

      - name: ✅ Auto approve PR
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        run: gh pr review --approve "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔀 Auto merge PR
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.OMRS_BOT_GH_TOKEN }}
