name: "Scheduled Transifex Update"

on:
  schedule:
    # every day at 8:05 PM UTC
    - cron: "5 20 * * *"
  workflow_dispatch:

jobs:
  pull-translations:
    uses: openmrs/openmrs-contrib-gha-workflows/.github/workflows/tx-pull.yml@main
    permissions:
      contents: write
      pull-requests: write
    with:
      pr_body: |
        # OpenMRS Translation Updates

        This PR contains updates to the translations pulled from Transifex

        > This PR was automatically generated and will be automatically merged if checks pass.
    secrets:
      TRANSIFEX_TOKEN: ${{ secrets.TRANSIFEX_TOKEN }}
      BOT_GH_TOKEN: ${{ secrets.OMRS_BOT_GH_TOKEN }}
